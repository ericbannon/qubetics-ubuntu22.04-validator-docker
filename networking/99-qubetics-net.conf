## /etc/sysctl.d/99-qubetics-net.conf
# Qubetics validator networking tune

# Big socket buffers for high-throughput P2P
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432

net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Bigger packet backlog on the NIC
net.core.netdev_max_backlog = 30000

# Allow more half-open TCP connections (SYN backlog)
net.ipv4.tcp_max_syn_backlog = 8192

# Make sure fq + bbr stay in place
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

